# test.yml

project_name: "deep-stylometry"

model:
  pooling_method: "li"
  skip_list: true

data:
  ds_name: "halvest" # or halvest
  batch_size: 64
  tokenizer_name: "answerdotai/ModernBERT-base"
  max_length: 512
  padding: "do_not_pad"
  truncation: "longest_first"
  add_special_tokens: true
  map_batch_size: 1000
  load_from_cache_file: true
  subsets: ["base-2", "base-4", "base-6", "base-8", "base-10"]
  shuffle: true
  test_subset: "base-2"

test:
  device: "gpu"
  num_devices: 1
  log_every_n_steps: 1
  precision: "16-mixed" # 32-true or 16-mixed
  # --- wandb logger ---
  use_wandb: true
