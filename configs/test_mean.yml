# test_mean.yml — Baseline B4: single-vector mean-pooling evaluation

project_name: "deep-stylometry"

model:
  pooling_method: "mean"
  skip_list: false

data:
  ds_name: "halvest"
  batch_size: 64
  tokenizer_name: "answerdotai/ModernBERT-base"
  max_length: 512
  padding: "do_not_pad"
  truncation: "longest_first"
  add_special_tokens: true
  map_batch_size: 1000
  load_from_cache_file: true
  subsets: ["base-2", "base-4", "base-6", "base-8", "base-10"]
  shuffle: true
  test_subset: "base-4"

test:
  device: "gpu"
  num_devices: 1
  log_every_n_steps: 1
  precision: "16-mixed"
  use_wandb: true
